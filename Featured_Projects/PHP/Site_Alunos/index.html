<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="login" class="card">
  <h2>Login</h2>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Entrar</button>
</div>

<div id="app" style="display:none">

  <div class="topbar">
    <h2>Dashboard Aula 18</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="stats">
    <div class="card" id="total"></div>
    <div class="card" id="media"></div>
  </div>

  <div id="extraStats" class="stats"></div>

  <div class="card">
    <h3>Alunos</h3>
    <div id="alunos"></div>
  </div>

  <div id="adminPanel" class="card">
    <h3>Admin Panel</h3>

    <input id="nome" placeholder="Nome">
    <input id="idade" placeholder="Idade">
    <button onclick="createAluno()">Adicionar</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
