
<!-- Contact Form - Global Adventures Blog -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Global Adventures Blog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Contact Us ✉️</h1>
        <p>Got a travel story to share? Questions about our adventures? Drop us a message!</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="city1.html">Paris</a></li>
            <li><a href="city2.html">Tokyo</a></li>
            <li><a href="city3.html">New York</a></li>
            <li><a href="gallery.html">Gallery</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Send Us a Message</h2>

            <form action="/submit-form" method="post">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject">

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit">Send Message</button>

            </form>
        </section>
    </main>

    <footer>
        <p>Contact us at: <a href="mailto:contact@example.com">contact@example.com</a></p>
        <p><a href="index.html">Back to Home</a></p>
        <p>&copy; 2026 Global Adventures Blog. All rights reserved.</p>
    </footer>

</body>
</html>
