
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sistema de Reservas</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS personalizado -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="py-4">
        <div class="container">
            <h1 class="h2 mb-1">Sistema de Reservas</h1>
            <p class="mb-0">Marca e consulta as tuas reservas.</p>
        </div>
    </header>

    <main class="container py-4">

        <div class="row g-4">

            <!-- Formulário de reservas -->
            <section class="col-12 col-lg-5">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h2 class="h4 mb-3">Efetuar reserva</h2>

                        <form id="reservaForm">

                            <div class="mb-3">
                                <label for="nome" class="form-label">
                                    Nome
                                </label>

                                <input
                                    class="form-control"
                                    id="nome"
                                    name="nome"
                                    maxlength="100"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="data" class="form-label">
                                    Data
                                </label>

                                <input
                                    class="form-control"
                                    id="data"
                                    name="data"
                                    type="date"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="hora" class="form-label">
                                    Hora
                                </label>

                                <input
                                    class="form-control"
                                    id="hora"
                                    name="hora"
                                    type="time"
                                    required
                                >
                            </div>

                            <button
                                class="btn btn-primary w-100"
                                id="submitBtn"
                                type="submit"
                            >
                                Confirmar reserva
                            </button>

                            <div
                                id="mensagem"
                                class="mt-3"
                                role="status"
                                aria-live="polite"
                            ></div>

                        </form>

                    </div>
                </div>

            </section>

            <!-- Lista de reservas -->
            <section class="col-12 col-lg-7">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h2 class="h4 mb-0">
                                Reservas existentes
                            </h2>

                            <button
                                class="btn btn-outline-secondary btn-sm"
                                id="atualizarBtn"
                                type="button"
                            >
                                Atualizar
                            </button>

                        </div>

                        <div id="listaReservas">
                            <p class="text-secondary mb-0">
                                A carregar reservas...
                            </p>
                        </div>

                    </div>
                </div>

            </section>

        </div>

    </main>

    <!-- Rodapé -->
    <footer class="container text-center py-4 text-secondary">
        <small>
            Projeto desenvolvido com Python, Flask, HTML, CSS e JavaScript.
        </small>
    </footer>


    <!-- JavaScript -->
    <script>

        const formulario = document.getElementById("reservaForm");

        const lista = document.getElementById("listaReservas");

        const mensagem = document.getElementById("mensagem");

        const botao = document.getElementById("submitBtn");

        const campoData = document.getElementById("data");


        // Impedir a escolha de datas anteriores a hoje

        const hoje = new Date();

        const hojeLocal = new Date(
            hoje.getTime() - hoje.getTimezoneOffset() * 60000
        ).toISOString().slice(0, 10);

        campoData.min = hojeLocal;


        // Carregar e apresentar as reservas

        async function carregarReservas() {

            lista.innerHTML =
                '<p class="text-secondary">A carregar reservas...</p>';

            try {

                const resposta = await fetch("/api/reservas");

                if (!resposta.ok) {
                    throw new Error("Não foi possível obter as reservas.");
                }

                const reservas = await resposta.json();


                if (reservas.length === 0) {

                    lista.innerHTML =
                        '<p class="text-secondary mb-0">Ainda não existem reservas.</p>';

                    return;
                }


                // Criar tabela

                lista.replaceChildren();

                const tabela = document.createElement("div");

                tabela.className = "table-responsive";

                const tabelaHTML = document.createElement("table");

                tabelaHTML.className =
                    "table table-striped align-middle mb-0";

                const cabecalho = document.createElement("thead");

                cabecalho.innerHTML =
                    "<tr><th>Nome</th><th>Data</th><th>Hora</th></tr>";

                const corpo = document.createElement("tbody");


                // Percorrer as reservas

                reservas.forEach((reserva) => {

                    const linha = document.createElement("tr");

                    [reserva.nome, reserva.data, reserva.hora]
                        .forEach((valor) => {

                            const celula = document.createElement("td");

                            celula.textContent = valor;

                            linha.appendChild(celula);

                        });

                    corpo.appendChild(linha);

                });


                tabelaHTML.append(cabecalho, corpo);

                tabela.appendChild(tabelaHTML);

                lista.appendChild(tabela);


            } catch (erro) {

                lista.innerHTML =
                    '<p class="text-danger mb-0">Erro ao carregar as reservas. Tenta novamente.</p>';

            }

        }


        // Enviar uma nova reserva

        formulario.addEventListener("submit", async (evento) => {

            evento.preventDefault();

            mensagem.textContent = "";

            mensagem.className = "mt-3";

            botao.disabled = true;


            // Obter os dados do formulário

            const dados = {

                nome: formulario.nome.value.trim(),

                data: formulario.data.value,

                hora: formulario.hora.value

            };


            try {

                const resposta = await fetch("/api/reservas", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(dados)

                });


                const resultado = await resposta.json();


                if (!resposta.ok) {

                    throw new Error(
                        resultado.erro ||
                        "Não foi possível criar a reserva."
                    );

                }


                // Mensagem de sucesso

                mensagem.textContent = resultado.mensagem;

                mensagem.classList.add("text-success");


                // Limpar formulário

                formulario.reset();

                campoData.min = hojeLocal;


                // Atualizar lista de reservas

                await carregarReservas();


            } catch (erro) {

                mensagem.textContent = erro.message;

                mensagem.classList.add("text-danger");

            } finally {

                botao.disabled = false;

            }

        });


        // Botão para atualizar a lista

        document.getElementById("atualizarBtn")
            .addEventListener("click", carregarReservas);


        // Carregar reservas ao abrir a página

        carregarReservas();

    </script>

</body>
</html>
