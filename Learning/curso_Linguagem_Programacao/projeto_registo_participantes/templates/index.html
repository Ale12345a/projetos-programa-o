
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo de Participantes</title>
</head>
<body>

    <h1>Registo de Participantes</h1>

    <form id="formulario">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required maxlength="100">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <br><br>

        <label for="codigo_postal">Código postal:</label>
        <input
            type="text"
            id="codigo_postal"
            placeholder="0000-000"
            pattern="[0-9]{4}-[0-9]{3}"
            required
        >

        <br><br>

        <button type="submit">Registar participante</button>
    </form>

    <p id="mensagem"></p>

    <hr>

    <h2>Participantes registados</h2>

    <ul id="lista-participantes"></ul>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
